name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npm run check:web:states
      - run: npm run check:web:browser
      - run: npm run check
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash ./gradlew build --no-daemon
        working-directory: game
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: space-game-${{ github.sha }}
          path: game/build/libs/space-client-0.1.0.jar
          if-no-files-found: error
  launcher:
    needs: game
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:launcher
      - run: npm run check --workspace @space/launcher
      - run: node apps/launcher/scripts/smoke-auth-vault.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: space-game-${{ github.sha }}
          path: game/build/libs
      - run: npm run build:launcher
        env:
          SPACE_REQUIRE_GAME_BUNDLE: '1'
      - run: npm run check:ui --workspace @space/launcher
