plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'legacy-looming' version "${loom_version}"
}

version = project.mod_version
group = 'dev.spaceclient'
base { archivesName = 'space-client' }

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings(legacy.yarn(project.minecraft_version, project.yarn_build))
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    testImplementation 'junit:junit:4.13.2'
    // Align the legacy Minecraft logger with the current dev launcher.
    runtimeOnly 'org.apache.logging.log4j:log4j-api:2.26.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.26.1'
}
loom {
    // The default config references Minecraft's server GUI appender, absent on clients.
    log4jConfigs.setFrom(file('config/log4j2.xml'))
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}
