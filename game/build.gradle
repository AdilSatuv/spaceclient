plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'legacy-looming' version "${loom_version}"
}

version = project.mod_version
group = 'dev.spaceclient'
base { archivesName = 'space-client' }

// Bind distributed development jars to the committed game source tree.
def gameSourceTree = providers.exec {
    workingDir rootProject.projectDir.parentFile
    commandLine 'git', 'rev-parse', 'HEAD:game'
}.standardOutput.asText.map { it.trim() }
def buildModVersion = project.version.toString()
def buildMinecraftVersion = project.minecraft_version.toString()
def buildLoaderVersion = project.loader_version.toString()

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings(legacy.yarn(project.minecraft_version, project.yarn_build))
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    testImplementation 'junit:junit:4.13.2'
    // Align the legacy Minecraft logger with the current dev launcher.
    runtimeOnly 'org.apache.logging.log4j:log4j-api:2.26.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.26.1'
}
loom {
    // The default config references Minecraft's server GUI appender, absent on clients.
    log4jConfigs.setFrom(file('config/log4j2.xml'))
}
processResources {
    inputs.property 'version', buildModVersion
    inputs.property 'gameSourceTree', gameSourceTree
    filesMatching('fabric.mod.json') { expand version: buildModVersion }
    doLast {
        def sourceTree = gameSourceTree.get()
        if (!(sourceTree ==~ /[a-f0-9]{40}/)) throw new GradleException('Invalid game source tree')
        new File(destinationDir, 'spaceclient-build.properties').text =
            "schemaVersion=1\ngameSourceTree=${sourceTree}\nmodVersion=${buildModVersion}\nminecraftVersion=${buildMinecraftVersion}\nloaderVersion=${buildLoaderVersion}\nchannel=development\n"
    }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}
